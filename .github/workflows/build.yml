name: kernel

on:
  push:
  workflow_dispatch:

jobs:
  # Loader, shim and mapple-install build on the Linux host. This job is only
  # what that host cannot build: their mka kernel, which stops without Xcode's
  # iig and the Kernel Debug Kit.
  kernel:
    name: kernel
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Xcode with iig
        run: |
          xcode=""
          for app in /Applications/Xcode_*.app; do
            dev="$app/Contents/Developer"
            if DEVELOPER_DIR="$dev" xcrun --find iig >/dev/null 2>&1; then
              xcode="$dev"
              break
            fi
          done
          if [ -z "$xcode" ]; then
            echo "no Xcode on this image has iig; their mka cannot start"
            xcode-select -p || true
            ls /Applications || true
            exit 1
          fi
          echo "XCODE15_DEVELOPER_DIR=$xcode" >> "$GITHUB_ENV"
          echo "DEVELOPER_DIR=$xcode" >> "$GITHUB_ENV"
          echo "using $xcode"

      - name: tools
        run: brew install jq

      - name: tree
        run: bash ci/assemble.sh "$RUNNER_TEMP/tree"

      - name: kernel
        working-directory: ${{ runner.temp }}/tree
        run: |
          set -euo pipefail
          # Their MediaTek patches are compiled in only for MACHINE_CONFIG MT6781.
          # rosemary's own machine name is not a board config in that tree yet.
          python3 - << 'PY'
          from pathlib import Path
          p = Path("device/xiaomi/rosemary/device.conf")
          t = p.read_text()
          t = t.replace("\tmachine\tMT6785", "\tmachine\tMT6781")
          p.write_text(t)
          PY
          # shellcheck disable=SC1091
          . build/envsetup.sh
          lunch mapple_rosemary-userdebug
          mka kernel

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kernel
          path: ${{ runner.temp }}/tree/out/target/product/rosemary/kernel
