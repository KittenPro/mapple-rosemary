# Redmi Note 10S. Written by mapple-bringup from the vendor's trees: facts only, nothing here has run on the phone.
device rosemary
	title	Redmi Note 10S (rosemary)
	vendor	Xiaomi
	soc	mt6785
	soc_vendor	mediatek
	machine	MT6785
	boot	lk-chain
	bootimg_version	2
	bootimg_pagesize	2048
	bootimg_base	0x40078000
	bootimg_kernel_offset	0x00008000
	bootimg_ramdisk_offset	0x07c08000
	bootimg_tags_offset	0x0bc08000
	bootimg_dtb_offset	0x0bc08000
# the stock boot_b header (ANDROID! v2): os version word 0x220001aa
	bootimg_os_version	17.0.0
	bootimg_os_patch_level	2026-10
# chain() gzips the loader itself; this key is the shim's form, read on the Qualcomm path
	bootimg_kernel	raw
	defconfig	rosemary_defconfig
	firmware	pull-firmware.sh
	maintainer	unmaintained
	cmdline	cpus=8 mp_ufslun=2 mp_ufsroot=xnusys unentitled_ios_sim_launch=1 ignition_level=1 launchd_unsecure_cache=1
	adt	--ufs --audio --torch
	gpu	mali
	loader	-DXNU_SHIM=1
	dev_loader	-DROOT_ROOM_MIB=0
# spaced's ceiling. On this phone the real limit is the embedded vbmeta at 0x2271000:
# mapple-install chain refuses an image that reaches it and keeps the stock tail.
	payload_max	0x3fe0000
# spaced's root size. userdata on this phone has the room (about 104 GiB after the carve).
	root_size	16g
	single_cmdline	mp_ufsroot=userdata mp_usblink=0
	single_loader	-DXNU_DEFAULT=1
	split_size	22
	split_loader	-DSPLIT_MENU=1
	status display missing lcm dsi_panel_k7_38_0c_0a_fhdp_video; size 1080,2400; lk_fb base=0x7bd20000 vram=0x22e0000; lk_fb base=0x7bd20000 vram=0x22e0000 fps_x100=6032 lcm=dsi_panel_...
	status touch missing chip goodix,gt9885
	status buttons missing keypad base=0x10010000
	status cpu missing cores 6x a55 + 2x a76 (MIDR 0xd05, 0xd0b; the dts says a75)
	status gpu missing mali base=0x13040000 compat=arm,mali-midgard,arm,ma... irqs=309,...; mfgcfg base=0x13fbf000
	status storage missing type ufs; controller base=0x11270000 size=0x2300; system_lun 2
	status sensors missing scp base=0x10500000 sram=0xc0000; sspm base=0x10400000
	status wifi missing chip MT6631; consys base=0x18002000 compat=mediatek,mt6785-consys
	status bluetooth missing btif base=0x1100c000 size=0x1000; chip MT6631
	status audio missing codec_node mt6359_snd,sound; amplifiers_on AW87XXX; afe base=0x82cd0000 compat=mediatek,mdafe
	status battery missing gauge mediatek,mt6359_gauge; charger mediatek,mt-charger; chip defconfig=MT6359 dts=mediatek,mt6359-pmic
	status haptic missing node vibrator@0
	status camera missing sensors ov64b40semco_mipi_r...,ov64b40ofilm_mipi_r...,ov13b10sunny_...
	status torch missing flash dts=mediatek,flashlights_mt... defconfig=MT6360_PMU_FLED
	status cellular missing blocks mediatek,ap_ccif0,mediatek,ap_ccif1,mediatek,ap_ccif2,media...
	status thermal missing controller compat=mediatek,therm_ctrl base=0x1100b000
