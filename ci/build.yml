name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # The loader, the shim and the installer. Linux and the Mac both run this.
  # mka itself is not invoked: it stops unless Xcode 15.4's iig is present, and
  # GitHub retired the macos-14 image that carried Xcode 15.4 (2 November 2026).
  portable:
    name: loader and shim (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: tools
        run: |
          if [ "$(uname)" = Darwin ]; then
            brew install llvm zig
            echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install -y clang lld zig python3
          fi

      - name: build
        run: bash ci/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: rosemary-${{ matrix.os }}
          path: out/ci/

  # Their kernel build, on the Mac runner that still exists. Xcode 15.4 is gone
  # with macos-14; this uses whichever installed Xcode still has iig, and downloads
  # the Kernel Debug Kit the way darwin-xnu-build does (no Apple login).
  kernel:
    name: kernel
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Xcode with iig
        run: |
          xcode=""
          for app in /Applications/Xcode_*.app; do
            dev="$app/Contents/Developer"
            if DEVELOPER_DIR="$dev" xcrun --find iig >/dev/null 2>&1; then
              xcode="$dev"
              break
            fi
          done
          if [ -z "$xcode" ]; then
            echo "no Xcode on this image has iig; their mka cannot start"
            xcode-select -p || true
            ls /Applications || true
            exit 1
          fi
          echo "XCODE15_DEVELOPER_DIR=$xcode" >> "$GITHUB_ENV"
          echo "DEVELOPER_DIR=$xcode" >> "$GITHUB_ENV"

      - name: tools
        run: brew install llvm zig jq

      - name: tree
        run: bash ci/assemble.sh "$RUNNER_TEMP/tree"

      - name: kernel
        working-directory: ${{ runner.temp }}/tree
        run: |
          set -euo pipefail
          # Their MediaTek patches are compiled in only for MACHINE_CONFIG MT6781.
          # rosemary's own machine name is not a board config in that tree yet.
          python3 - << 'PY'
          from pathlib import Path
          p = Path("device/xiaomi/rosemary/device.conf")
          t = p.read_text()
          t = t.replace("\tmachine\tMT6785", "\tmachine\tMT6781")
          p.write_text(t)
          PY
          # shellcheck disable=SC1091
          . build/envsetup.sh
          lunch mapple_rosemary-userdebug
          mka kernel
